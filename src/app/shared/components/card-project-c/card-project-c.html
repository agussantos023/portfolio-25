<div
  class="group bg-second-c rounded-xl overflow-hidden flex flex-col md:flex-row items-stretch gap-6 transition-all duration-300 hover:shadow-lg hover:shadow-primary-c/10 border border-transparent hover:border-primary-c/20"
>
  <div class="w-full md:w-3/8 overflow-hidden">
    <img
      [src]="data().image"
      [alt]="data().title"
      class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
    />
  </div>

  <div class="w-full md:w-3/5 p-6 pt-0 md:pt-6 md:pl-0 flex flex-col justify-between gap-4">
    <div>
      <h5 class="text-3xl font-modak-f text-primary-c tracking-widest">
        {{ data().title | uppercase }}
      </h5>
      <p class="text-text-c/80 text-base leading-relaxed font-winky-f">
        {{ data().description }}
      </p>
    </div>

    <div class="flex flex-wrap items-center justify-between gap-4 mt-auto">
      <div class="flex items-center gap-3">
        @for (icon of data().techStack; track icon) {
          <app-svg-icon-c
            [iconName]="icon"
            [size]="22"
            class="opacity-80 hover:opacity-100 transition-opacity"
          />
        }
      </div>

      @if (data().link) {
        <a
          [href]="data().link"
          target="_blank"
          class="relative overflow-hidden flex items-center gap-2 px-5 py-2 rounded-lg bg-primary-c/10 text-primary-c font-winky-f font-bold text-xs tracking-widest border border-primary-c/30 hover:bg-primary-c hover:text-background-c transition-all duration-300 group/btn"
        >
          <span class="relative z-10">VER PROYECTO</span>

          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2.5"
            stroke="currentColor"
            class="w-4 h-4 relative z-10 transition-transform duration-300 group-hover/btn:translate-x-1 group-hover/btn:-translate-y-0.5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="m4.5 19.5 15-15m0 0H8.25m11.25 0v11.25"
            />
          </svg>
        </a>
      }
    </div>
  </div>
</div>
