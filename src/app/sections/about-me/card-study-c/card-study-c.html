<div
  class="group relative bg-second-c rounded-md m-2 p-6 font-winky-f transition-all duration-300 hover:-translate-y-1 hover:shadow-[0_10px_30px_-15px_rgba(0,0,0,0.5)]"
>
  <div
    class="absolute bottom-4 right-4 opacity-[0.05] group-hover:opacity-50 transition-opacity duration-500"
  >
    <app-svg-icon-c
      [iconName]="studyData().level.includes('Superior') ? 'angular' : 'gears'"
      [size]="120"
    />
  </div>

  <span
    class="absolute -top-3 right-8 translate-x-1/2 text-xs md:text-sm rotate-6 font-bold rounded px-3 py-1 bg-gray-950 text-white group-hover:bg-primary-c group-hover:-rotate-2 shadow-xl transition-all duration-500 z-20"
  >
    {{ studyData().date }}
  </span>

  <header class="mb-6 relative z-10">
    <h5 class="text-xl md:text-2xl font-bold text-white">
      {{ studyData().title }}
    </h5>
    <h6
      class="text-xs md:text-sm uppercase tracking-[0.2em] text-white group-hover:text-primary-c transition-colors font-bold mt-1"
    >
      {{ studyData().level }}
    </h6>
  </header>

  <div class="space-y-5 relative z-10 ml-5">
    @for (text of studyData().text; track $index) {
      <div class="relative">
        <span class="absolute top-0 -left-5 text-primary-c text-lg leading-none">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
            <path
              fill="currentColor"
              d="M10.5 16.3q-.2 0-.35-.137T10 15.8V8.2q0-.225.15-.362t.35-.138q.05 0 .35.15l3.625 3.625q.125.125.175.25t.05.275t-.05.275t-.175.25L10.85 16.15q-.075.075-.162.113t-.188.037"
            />
          </svg>
        </span>

        <p
          [innerHTML]="text | highlight"
          class="text-sm md:text-base leading-snug text-gray-400 group-hover:text-gray-100 transition-colors"
        ></p>
      </div>
    }
  </div>
</div>
