<div
  class="group bg-second-c p-3 rounded-md h-full flex flex-col justify-start items-center gap-5 hover:scale-105 duration-400 ease-out"
>
  <h4 class="text-text-c font-winky-f font-bold md:text-2xl">
    {{ dataCard().title | titlecase }}
  </h4>

  <div class="flex flex-wrap justify-center items-center gap-3 md:gap-0">
    @for (icon of dataCard().nameIcons; track icon) {
      <app-svg-icon-c [iconName]="icon" [size]="28" [isViewName]="true" />
    }
  </div>
</div>
